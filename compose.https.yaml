services:
  proxy:
    build: .
    environment:
      UPSTREAM: ${UPSTREAM:?Set UPSTREAM in .env}
      CACHE_BYPASS_PATHS: "${CACHE_BYPASS_PATHS:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      ACCESS_LOG: "${ACCESS_LOG:-false}"
      UPSTREAM_CONNECT_TIMEOUT: "${UPSTREAM_CONNECT_TIMEOUT:-30s}"
      UPSTREAM_TLS_TIMEOUT: "${UPSTREAM_TLS_TIMEOUT:-10s}"
      UPSTREAM_HEADER_TIMEOUT: "${UPSTREAM_HEADER_TIMEOUT:-30s}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - proxy
volumes:
  caddy_data:
  caddy_config:
