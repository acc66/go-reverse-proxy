services:
  proxy:
    build: .
    environment:
      UPSTREAM: ${UPSTREAM:?Set UPSTREAM in .env}
      CACHE_BYPASS_PATHS: "${CACHE_BYPASS_PATHS:-}"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - proxy
volumes:
  caddy_data:
  caddy_config:
