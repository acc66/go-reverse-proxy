name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t go-reverse-proxy .
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Syntax and failure-path tests
        run: |
          bash -n scripts/proxyctl scripts/install.sh scripts/test-manager.sh
          bash scripts/test-manager.sh
      - name: Install and restart real systemd service using offline package
        run: |
          mkdir -p /tmp/proxy-package
          CGO_ENABLED=0 go build -o /tmp/proxy-package/go-reverse-proxy .
          tar -czf /tmp/go-reverse-proxy-v1.2.0-linux-amd64.tar.gz -C /tmp/proxy-package go-reverse-proxy
          cd /tmp
          sha256sum go-reverse-proxy-v1.2.0-linux-amd64.tar.gz > proxy-SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          sudo bash scripts/install.sh --no-https --upstream http://127.0.0.1:1 --version v1.2.0 --archive /tmp/go-reverse-proxy-v1.2.0-linux-amd64.tar.gz --checksums /tmp/proxy-SHA256SUMS.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 502
          sudo proxyctl offline-upgrade v1.2.0 /tmp/go-reverse-proxy-v1.2.0-linux-amd64.tar.gz /tmp/proxy-SHA256SUMS.txt
          sudo systemctl is-active --quiet go-reverse-proxy
          grep -Fx 'CACHE_BYPASS_PATHS=/auth,/password,/payment,/res,/v1,/sublink,/wordpress,/user' /etc/go-reverse-proxy.env || sudo grep -Fx 'CACHE_BYPASS_PATHS=/auth,/password,/payment,/res,/v1,/sublink,/wordpress,/user' /etc/go-reverse-proxy.env
      - name: Service logs
        if: always()
        run: sudo journalctl -u go-reverse-proxy -n 100 --no-pager
