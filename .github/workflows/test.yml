name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t go-reverse-proxy .
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Syntax and failure-path tests
        run: |
          for script in scripts/fango scripts/install.sh scripts/test-manager.sh; do bash -n "$script"; done
          bash scripts/test-manager.sh
          python3 scripts/test_sites.py
      - name: Install and restart real systemd service using offline package
        run: |
          mkdir -p /tmp/proxy-package
          CGO_ENABLED=0 go build -o /tmp/proxy-package/go-reverse-proxy .
          tar -czf /tmp/go-reverse-proxy-v1.2.0-linux-amd64.tar.gz -C /tmp/proxy-package go-reverse-proxy
          cd /tmp
          sha256sum go-reverse-proxy-v1.2.0-linux-amd64.tar.gz > proxy-SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          sudo mkdir -p /opt/go-reverse-proxy
          sudo cp /tmp/proxy-package/go-reverse-proxy /opt/go-reverse-proxy/go-reverse-proxy
          printf '%s\n' 'UPSTREAM=http://127.0.0.1:1' 'LISTEN_ADDR=127.0.0.1:8080' 'CACHE_BYPASS_PATHS=/auth,/password,/payment,/res,/v1,/sublink,/wordpress,/user' 'ACCESS_LOG=true' | sudo tee /etc/go-reverse-proxy.env >/dev/null
          printf '%s\n' '[Unit]' 'Description=Legacy proxy fixture' '[Service]' 'EnvironmentFile=/etc/go-reverse-proxy.env' 'ExecStart=/opt/go-reverse-proxy/go-reverse-proxy' '[Install]' 'WantedBy=multi-user.target' | sudo tee /etc/systemd/system/go-reverse-proxy.service >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable --now go-reverse-proxy
          sudo bash scripts/install.sh --no-https --upstream http://127.0.0.1:1 --version v1.2.0 --archive /tmp/go-reverse-proxy-v1.2.0-linux-amd64.tar.gz --checksums /tmp/proxy-SHA256SUMS.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 502
          sudo fango offline-upgrade v1.2.0 /tmp/go-reverse-proxy-v1.2.0-linux-amd64.tar.gz /tmp/proxy-SHA256SUMS.txt
          sudo systemctl is-active --quiet fango
          grep -Fx 'CACHE_BYPASS_PATHS=/auth,/password,/payment,/res,/v1,/sublink,/wordpress,/user' /etc/fango.env || sudo grep -Fx 'CACHE_BYPASS_PATHS=/auth,/password,/payment,/res,/v1,/sublink,/wordpress,/user' /etc/fango.env
          ! sudo systemctl is-active --quiet go-reverse-proxy
          test "$(systemctl is-enabled go-reverse-proxy || true)" = disabled
          sudo fango set-upstream https://api10.seox9.com/
          sudo grep -Fx 'UPSTREAM=https://api10.seox9.com/' /etc/fango.env
          sudo fango uninstall --yes
          test -f /etc/fango.env
          test ! -e /opt/fango/fango
          ! sudo systemctl is-active --quiet fango
      - name: Service logs
        if: always()
        run: sudo journalctl -u fango -n 100 --no-pager
